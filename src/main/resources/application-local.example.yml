# Copie este arquivo para application-local.yml e ajuste as variaveis no .env.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:${POSTGRES_DB:financemanager}}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  docker:
    compose:
      lifecycle-management: start-and-stop
      start:
        command: up
      stop:
        command: stop

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

api:
  security:
    token:
      secret: ${JWT_SECRET}
