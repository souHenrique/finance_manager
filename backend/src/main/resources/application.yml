server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: nummo-api

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth-rate-limit:
    login:
      max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${AUTH_LOGIN_WINDOW:PT15M}
    register:
      max-attempts: ${AUTH_REGISTER_MAX_ATTEMPTS:5}
      window: ${AUTH_REGISTER_WINDOW:PT1H}
    max-tracked-clients: ${AUTH_RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.amorim.finance_manager: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-none}] %logger{36} - %msg%n"
