<header class="header">
  <a class="header__skip-link" href="#main-content"> Pular para o conteúdo </a>

  <button
    class="header__menu-button"
    type="button"
    aria-label="Abrir ou fechar menu"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuToggle.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <a class="header__brand" routerLink="/dashboard"> Finance Manager </a>

  <a class="header__profile" routerLink="/profile"> Perfil </a>

  <button
    class="header__logout"
    type="button"
    (click)="logout()"
  >
    Sair
  </button>
</header>
