<section
  class="alert"
  [class]="'alert alert--' + tone()"
  [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
>
  <span class="alert__symbol" aria-hidden="true">!</span>

  <div class="alert__content">
    @if (title()) {
      <strong>{{ title() }}</strong>
    }

    <span>{{ message() }}</span>
  </div>

  @if (dismissible()) {
    <button
      type="button"
      aria-label="Fechar aviso"
      (click)="dismissed.emit()"
    >
      ×
    </button>
  }
</section>
