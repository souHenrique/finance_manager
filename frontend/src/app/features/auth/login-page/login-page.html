<main class="auth-page">
  <section class="auth-page__card">
    <header class="auth-page__header">
      <h1>Entrar</h1>
      <p>Acesse sua conta para continuar.</p>
    </header>

    @if (submissionError()) {
      <app-alert tone="danger" title="Não foi possível entrar" [message]="submissionError()!" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field
        label="E-mail"
        controlId="login-email"
        [error]="fieldError('email')"
        [required]="true"
      >
        <input
          appInput
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
        />
      </app-form-field>

      <app-form-field
        label="Senha"
        controlId="login-password"
        [error]="fieldError('password')"
        [required]="true"
      >
        <input
          appInput
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </app-form-field>

      <app-button type="submit" [loading]="loading()" [disabled]="loading()"> Entrar </app-button>
    </form>

    <p>
      Ainda não tem conta?
      <a routerLink="/register">Criar conta</a>
    </p>
  </section>
</main>
